<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nekudot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The whole app lives in one centered column. -->
  <main class="app">

    <!--
      HEADER — the title identifies the app; the tap-hint (the
      "Signifier") tells you the card is tappable. It arrives now, in
      Slice 2, because there is finally a real behaviour for it to describe.
      The corner controls (Level ▾ top-left, language ☰ top-right) come in
      later slices.
    -->
    <header class="app-header">
      <h1 class="app-title" data-string="app_title">Nekudot</h1>
      <p class="tap-hint" data-string="reveal_prompt">Tap the card to reveal the answer</p>
    </header>

    <!--
      PROGRESS — how much of the current deck has been seen. Sits above
      the card. A bar that fills to the percentage, plus a plain line.
      Both are filled by app.js and recompute after every move.
    -->
    <section class="progress" id="progress">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-line" id="progress-line"></p>
    </section>

    <!--
      THE CARD — tap anywhere on it to reveal / hide the answer.
      The revealed NAME (top-left) and SOUND (beneath the mark) are a
      separate layer: they are always in the page but invisible, and only
      fade in on tap. They sit *over* the card rather than in the column,
      so revealing them never nudges the pictogram (the mark you already
      signed off keeps its size). The rare badge and progress bar for the
      revealed state come in later slices. The empty src/alt are filled by
      app.js once the data has loaded.
    -->
    <section class="card" id="card">
      <p class="card-name" id="card-name"></p>
      <div class="card-figure">
        <img class="pictogram" id="pictogram" src="" alt="" />
      </div>
      <p class="card-sound" id="card-sound"></p>
      <p class="card-position" id="card-position"></p>
    </section>

    <!--
      CONTROLS — below the card, never on it. A tap on the card only ever
      reveals; MOVING through the deck is these buttons' job (this is the
      log-40 split: tap does one thing, Next does the other).
    -->
    <nav class="controls">
      <div class="stepper">
        <button class="btn" id="btn-prev" data-string="nav_prev">Previous</button>
        <button class="btn" id="btn-next" data-string="nav_next">Next</button>
      </div>
      <div class="mode" role="group" aria-label="Study mode">
        <button class="mode-btn" id="mode-inorder" data-string="mode_inorder">In order</button>
        <button class="mode-btn" id="mode-shuffle" data-string="mode_shuffle">Shuffle</button>
      </div>
    </nav>

    <!-- Shown only if the data can't load, so a failure is never a blank screen. -->
    <p class="load-error" id="load-error" hidden></p>

  </main>

  <script src="app.js"></script>
</body>
</html>

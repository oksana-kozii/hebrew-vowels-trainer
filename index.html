<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nekudot</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <!-- The whole app lives in one centered column. -->
  <main class="app" id="app">

    <!--
      HEADER — the title identifies the app; the tap-hint (the "Signifier")
      tells you the card is tappable.

      CORNER CONTROLS live on the tap-hint's row, one in each side cell:
      the Level (difficulty) menu is the FIRST of them, top-left. The
      right-hand cell is reserved and empty for now — Slice 5's language
      menu drops straight into it, mirroring this one, with no rework. The
      hint sits centred between the two cells (both cells flex equally, so
      the hint stays truly centred under the title).
    -->
    <header class="app-header">
      <h1 class="app-title" data-string="app_title">Nekudot</h1>

      <div class="hint-row">
        <!-- Level (difficulty) menu — top-left corner control. The lines
             inside are built by app.js from the levels PRESENT in the data
             (never hard-coded here), and their checked state is derived,
             not stored. -->
        <div class="level-menu" id="level-menu">
          <button class="level-menu-btn" id="level-menu-btn"
                  type="button" aria-haspopup="true" aria-expanded="false">
            <span data-string="level_label">Level</span>
            <span class="caret" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
          </button>
          <div class="level-panel" id="level-panel" role="group" aria-label="Level"></div>
        </div>

        <p class="tap-hint" data-string="reveal_prompt">Tap the card to reveal the answer</p>

        <!-- Slice 5: the language menu goes here, mirroring the level menu. -->
        <div class="header-slot header-slot-right" aria-hidden="true"></div>
      </div>
    </header>

    <!--
      GROUP FILTER — one chip per vowel group, built by app.js from
      groups.json (never hard-coded here). Multi-select: the deck is the
      union of the chips that are on. "All" means no group filter, and an
      empty selection means the same thing, so the row can never leave you
      with nothing to study. It sits above the progress bar because the
      filter DEFINES the deck and the bar DESCRIBES it.
    -->
    <section class="chips" id="chips" role="group" aria-label="Vowel groups"></section>

    <!--
      PROGRESS — how much of the current pass has been seen. Sits above
      the card. A bar that fills to the percentage, plus a plain line.
      Resets at the start of each new pass (a new lap, a mode switch, or
      a filter change) and counts against the FILTERED deck.
    -->
    <section class="progress" id="progress">
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-line" id="progress-line"></p>
    </section>

    <!--
      THE CARD — tap anywhere on it to reveal / hide the answer.
      The revealed NAME (top-left) and SOUND (lower band, beneath the mark)
      are a separate layer: always present, invisible until reveal, faded
      in so the pictogram never moves. The rare badge is a later slice.
    -->
    <section class="card" id="card">
      <p class="card-name" id="card-name"></p>
      <div class="card-figure">
        <img class="pictogram" id="pictogram" src="" alt="" />
      </div>
      <p class="card-sound" id="card-sound"></p>
      <p class="card-position" id="card-position"></p>
    </section>

    <!--
      EMPTY STATE — shown in place of the card, progress and controls when
      the filters match no cards, so the app never renders "Card 1 / 0".
      The chip row and the Level menu deliberately stay visible: the way
      out has to be on screen.
    -->
    <p class="empty-state" id="empty-state" data-string="empty_state" hidden>No cards match — adjust filters</p>

    <!--
      CONTROLS — below the card, never on it. Previous / Next step through
      the deck and WRAP at the ends (they never disable). The mode control
      is a sliding switch: the pill glides to the chosen side and a check
      confirms it — before "In order", after "Shuffle".
    -->
    <nav class="controls">
      <div class="stepper">
        <button class="btn" id="btn-prev" data-string="nav_prev">Previous</button>
        <button class="btn" id="btn-next" data-string="nav_next">Next</button>
      </div>

      <div class="mode" role="group" aria-label="Study mode">
        <span class="mode-thumb" aria-hidden="true"></span>
        <button class="mode-opt" id="mode-inorder">
          <span class="mode-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
          <span data-string="mode_inorder">In order</span>
        </button>
        <button class="mode-opt" id="mode-shuffle">
          <span data-string="mode_shuffle">Shuffle</span>
          <span class="mode-check" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span>
        </button>
      </div>
    </nav>

    <!-- Shown only if the data can't load, so a failure is never a blank screen. -->
    <p class="load-error" id="load-error" hidden></p>

  </main>

  <script src="app.js"></script>
</body>
</html>
